<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Monochrome App Icon & Monogram -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  
  <g fill="#FFFFFF">
    <!-- Sculptural Typographic 'T' with Cinema Proportions -->
    <!-- Top Horizontal Bar -->
    <path d="M 106 128 L 406 128 L 406 182 L 286 182 L 286 400 L 226 400 L 226 182 L 106 182 Z"/>
    
    <!-- Negative Space Cutout: Typewriter Slugline Cursor / Thought Beam in Crossbar -->
    <rect x="250" y="142" width="12" height="26" fill="#000000"/>
    
    <!-- Minimalist Thought Dot / Cinema Frame Registration Pin -->
    <circle cx="360" cy="155" r="7" fill="#000000"/>
  </g>

  <!-- Clean Border Stroke for Contrast on dark backgrounds -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#333333" stroke-width="2"/>
</svg>
